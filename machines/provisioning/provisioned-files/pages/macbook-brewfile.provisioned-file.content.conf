# Homebrew formulae + casks for a macOS MacBook at full dev-workstation parity.
# Applied by provision-macbook.sh via `brew bundle`, which reads this file where
# it stands. macOS-only — the Linux baseline is the `workstation-brewfile` page.

# Formulae — the agent external-tool baseline + dev toolchain.
brew "kubernetes-cli" # kubectl
brew "libpq"          # psql + pg_* client bins (keg-only; symlinked by the script)
brew "sops"           # age-encrypted secret manifests
brew "git"            # newer than the bundled Xcode CLT git
brew "node@22"        # node runtime for npx / playwright tooling
brew "tailscale"      # open-source CLI daemon (supports custom --login-server for headscale)
brew "node_exporter"  # Prometheus host metrics — `brew services start node_exporter` scrapes :9100
brew "appium"         # iOS Simulator driving (Appium 3 + xcuitest driver — see provision-macbook.sh step 11)

# Casks — GUI apps. `adopt: true` takes over an existing manual install instead
# of erroring on the pre-existing .app, so the script stays idempotent over a
# machine that was hand-set-up before this script existed.
cask "brave-browser",      args: { adopt: true }
cask "visual-studio-code", args: { adopt: true }
cask "1password",          args: { adopt: true }
cask "1password-cli"

# Miniforge — minimal conda installer defaulting to the conda-forge channel,
# native osx-arm64. Per-service isolated Python envs for AI inference (PyTorch /
# MPS, etc.); the conda init block lives in the managed .zshrc, not via
# `conda init` (which would rewrite that symlinked, read-only file). See CLAUDE.md.
cask "miniforge"
