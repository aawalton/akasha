<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>alanwalton</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: -apple-system, sans-serif; margin: 0; padding: 1.5rem;
        line-height: 1.4; display: flex; min-height: 80vh; align-items: center;
        justify-content: center; text-align: center; }
      .box { max-width: 22rem; }
      h1 { font-size: 1.15rem; }
      p { font-size: 0.95rem; opacity: 0.8; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <!-- LOCAL bundled entry (webDir=www). On launch it redirects to the live
         alanwalton.com site when online, or shows a friendly message when
         offline. This local-entry-redirect is the only reliable boot pattern on
         iOS WKWebView — `errorPath` hangs on cold-start offline. The shell has no
         offline product, so offline is just a graceful message, not a feature. -->
    <div class="box">
      <div id="splash" class="hidden">
        <h1>Opening alanwalton…</h1>
      </div>
      <div id="offline" class="hidden">
        <h1>You're offline</h1>
        <p>alanwalton needs a connection. Reconnect and reopen the app.</p>
      </div>
    </div>

    <script>
      const LIVE_URL = "https://alanwalton.com/home";
      const SITE = "alanwalton.com";
      // How long the launch waits for the address the app last showed before
      // giving up on it and opening LIVE_URL.
      const ASKING_MS = 500;
      const splashEl = document.getElementById("splash");
      const offlineEl = document.getElementById("offline");

      function onSite(url) {
        try {
          const at = new URL(url);
          return at.protocol === "https:" &&
            (at.hostname === SITE || at.hostname.endsWith("." + SITE));
        } catch {
          return false;
        }
      }

      // The LastPlace plugin keeps the alanwalton.com address the app last showed.
      // A missing plugin, a refusal, an address off the site, or no answer within
      // ASKING_MS all come back as null, which opens LIVE_URL.
      function lastPlace() {
        const plugin = window.Capacitor?.Plugins?.LastPlace;
        if (!plugin || typeof plugin.saved !== "function") return Promise.resolve(null);
        const asked = Promise.resolve()
          .then(() => plugin.saved())
          .then((said) => (said && typeof said.url === "string" && onSite(said.url) ? said.url : null))
          .catch(() => null);
        const waited = new Promise((resolve) => setTimeout(() => resolve(null), ASKING_MS));
        return Promise.race([asked, waited]);
      }

      if (navigator.onLine) {
        splashEl.classList.remove("hidden");
        // A brief tick so the splash paints before the navigation swap.
        const painted = new Promise((resolve) => setTimeout(resolve, 50));
        Promise.all([lastPlace(), painted]).then(([place]) => {
          window.location.replace(place ?? LIVE_URL);
        });
      } else {
        offlineEl.classList.remove("hidden");
      }
    </script>
  </body>
</html>
