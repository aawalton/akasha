# promtool rule-unit-test fixture for the cert-manager renewal-overdue tiers.
#
# Run by `promtool test rules`, which evaluates the rules in `rule_files`
# against the synthetic `input_series` below and asserts the exact set of
# alerts firing at each `eval_time`. `promtool check rules` only proves the
# rules PARSE, never that they FIRE.
#
# `rule_files` is the bare relative name `alerts.yml` on purpose — promtool
# resolves `rule_files` paths relative to the DIRECTORY OF THIS TEST FILE, and
# the harness materializes the composed ALERT_RULES as `alerts.yml` into a temp
# dir alongside a copy of this fixture.
#
# Semantics, as recorded by the domain-expiry fixture beside this one:
#
#   - Under `promtool test rules`, PromQL `time()` resolves to `eval_time`
#     measured from EPOCH 0, not wall clock. So a timestamp-gauge fixture value
#     is (desired offset from now) + (eval_time in seconds). At eval_time 65m
#     (= 3900s) a renewal 3 days in the PAST is 3900 - 259200 = -255300. A
#     negative gauge value is fine — these are floats, and the rules only ever
#     subtract them.
#   - `exp_labels` must NOT include `alertname` — promtool injects it.
#   - `humanizeDuration` renders the FULL form: `3d 0h 0m 0s`, never `3d`.
#   - An empty `exp_alerts: []` asserts the alert does NOT fire.
#
# Both tiers carry `for: 1h`, so eval_time 65m clears the hold and 30m does not.
#
# Every case feeds BOTH gauges with identical label sets, because the critical
# tier subtracts one from the other and default vector matching needs them to
# join one-to-one — which is how the live pair behaves (read against the
# cluster while building this: 3 series each, label sets matching).
#
# The shapes below are the estate's real ones: a 15-day renewBefore (the two
# cnpg-system barman certs) and a 30-day renewBefore (headscale-tls).

evaluation_interval: 1m

rule_files:
  - alerts.yml

tests:
  # THE CASE THE OLD RULE GOT WRONG. A 15-day-renewBefore cert, healthy, 4 days
  # before its renewal is due — which puts it 19 days from expiry, INSIDE the
  # old fixed 21-day window, so the old warning fired here on every cycle. Both
  # tiers must be silent: cert-manager is behaving exactly as configured.
  - name: healthy cert with a short renewBefore fires nothing though it is inside the old 21d window
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: 349500+0x70
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: 1645500+0x70
    alert_rule_test:
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdue
        exp_alerts: []
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdueCritical
        exp_alerts: []

  # THE CASE THE OLD RULE WAS BLIND TO, and the reason this repair exists. The
  # same 15-day-renewBefore cert, genuinely wedged: its renewal came due 3 days
  # ago and cert-manager has not moved the gauge. It is 12 days from expiry, so
  # a fixed days-to-expiry threshold reads it as HEALTHIER than the sound cert
  # in the case above and cannot separate the two. The warning fires on this
  # cert's own schedule; the critical stays silent because 12 days is still
  # more than a quarter of its 15-day margin.
  - name: wedged cert with a short renewBefore fires the warning alone
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: -255300+0x70
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: 1040700+0x70
    alert_rule_test:
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdue
        exp_alerts:
          - exp_labels:
              namespace: cnpg-system
              name: barman-cloud-client
              issuer_name: selfsigned-issuer
              severity: warning
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdueCritical
        exp_alerts: []

  # ESCALATION, on the 30-day-renewBefore shape the old rule assumed for every
  # cert. Wedged to 7 days from expiry, which is under a quarter of its 30-day
  # margin (7.5 days) — so the critical trips at the same moment the old fixed
  # 7-day critical did, now derived from the cert instead of hard-coded. The
  # warning fires too: the critical window is a subset of the overdue window,
  # and asserting both here is what stops a later "make the tiers mutually
  # exclusive" edit landing unnoticed.
  - name: wedged cert inside a quarter of its own margin fires both tiers
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="headscale",name="headscale-tls",issuer_name="letsencrypt-prod"}'
        values: -1983300+0x70
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="headscale",name="headscale-tls",issuer_name="letsencrypt-prod"}'
        values: 608700+0x70
    alert_rule_test:
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdueCritical
        exp_alerts:
          - exp_labels:
              namespace: headscale
              name: headscale-tls
              issuer_name: letsencrypt-prod
              severity: critical
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdue
        exp_alerts:
          - exp_labels:
              namespace: headscale
              name: headscale-tls
              issuer_name: letsencrypt-prod
              severity: warning

  # THE CRITICAL BOUNDARY, low side. Same 15-day margin, wedged to 4 days from
  # expiry — just OUTSIDE a quarter of that margin (3.75 days), so the critical
  # must stay silent. Paired with the case below this pins the threshold to a
  # fraction of the cert's own margin: a fixed 7-day critical would fire here,
  # and so would a fraction loosened past 4/15.
  - name: critical stays silent just outside a quarter of the margin
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: -946500+0x70
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: 349500+0x70
    alert_rule_test:
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdueCritical
        exp_alerts: []

  # THE CRITICAL BOUNDARY, high side. The same cert one day further gone, at 3
  # days from expiry — inside the 3.75-day quarter, so the critical fires. A
  # fraction tightened below 3/15 would miss it.
  - name: critical fires just inside a quarter of the margin
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: -1032900+0x70
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: 263100+0x70
    alert_rule_test:
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdueCritical
        exp_alerts:
          - exp_labels:
              namespace: cnpg-system
              name: barman-cloud-client
              issuer_name: selfsigned-issuer
              severity: critical

  # THE GRACE. Three hours past its renewal moment is inside the 6h grace, so
  # the warning is silent on the CONDITION rather than on the hold: the series
  # is flat and the condition is false at every step, including the whole hour
  # before eval. That last part is load-bearing — an earlier draft used one
  # hour overdue, and a grace dropped to `> 0` still passed it, because the
  # condition then turned true only 60 minutes before eval and the `for: 1h`
  # hold suppressed it anyway. Three hours makes the condition true from the
  # first step under that mutation, so only the grace can keep this quiet.
  - name: three hours past renewal is inside the grace and fires nothing
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-server",issuer_name="selfsigned-issuer"}'
        values: -6900+0x70
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-server",issuer_name="selfsigned-issuer"}'
        values: 1289100+0x70
    alert_rule_test:
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdue
        exp_alerts: []
      - eval_time: 65m
        alertname: CertManagerCertRenewalOverdueCritical
        exp_alerts: []

  # THE HOLD. Same wedged input as the second case, evaluated before `for: 1h`
  # elapses. Without this a dropped `for:` would pass every other case here.
  - name: the warning does not fire before its for-duration elapses
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: -255300+0x70
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system",name="barman-cloud-client",issuer_name="selfsigned-issuer"}'
        values: 1040700+0x70
    alert_rule_test:
      - eval_time: 30m
        alertname: CertManagerCertRenewalOverdue
        exp_alerts: []
