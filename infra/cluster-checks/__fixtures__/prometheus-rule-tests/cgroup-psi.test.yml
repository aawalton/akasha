# promtool rule-unit-test fixture for the #16327 cgroup-PSI collector.
#
# Run by `promtool test rules`, which evaluates the rules in `rule_files`
# against the synthetic `input_series` below and asserts the exact set of
# alerts firing at each `eval_time`. This is the fire-proof for the tiers:
# `promtool check rules` only proves the rules PARSE, never that they FIRE —
# see `check-prometheus-rules.ts`.
#
# The worker-supervisor CPU-pressure tripwire and its absent-guard were retired
# by #18350, and their cases went with them. What replaced them was a headroom
# watch on the merge-queue coordinator's config-load durations, and that watch
# went with the merge queue itself — nothing now watches the per-pod condition,
# so no fixture stands in for these cases.
#
# `rule_files` is the bare relative name `alerts.yml` on purpose — promtool
# resolves `rule_files` paths relative to the DIRECTORY OF THIS TEST FILE, and
# the harness materializes the composed ALERT_RULES as `alerts.yml` into a temp
# dir alongside a copy of this fixture (same convention as domain-expiry.test.yml).
#
# Semantics observed against promtool v2.54.1 (not inferred — verified live
# against the actual composed ALERT_RULES before authoring this fixture):
#
#   - `exp_labels` must NOT include `alertname` — promtool injects it
#     automatically, and including it fails the exact-match.
#   - `exp_annotations` compares the WHOLE annotation map, and there is no
#     "don't care": omitting it from a firing `exp_alerts` entry asserts the
#     map is EMPTY, which fails against a rule that renders summary+description.
#     So every firing case below reproduces both annotations verbatim, in
#     their RENDERED form — {{ $value }} and {{ $labels.* }} substituted with
#     the actual numbers/strings the input series produce.
#   - `time() - node_textfile_mtime_seconds{file="..."}` retains every label on
#     the matched series (file, instance, ...) — the fired alert carries file,
#     instance, severity (+ alertname).
#   - `time()` resolves from epoch 0 relative to `eval_time`, NOT wall clock, so
#     a "freshness" gauge fixture value is (eval_time in seconds) - (desired
#     age). At eval_time 20m (= 1200s): 10s old -> 1190; 400s old -> 800.

evaluation_interval: 1m

rule_files:
  - alerts.yml

tests:
  # Collector death signal: the published textfile's mtime is 400s old (past
  # the 300s / ten-missed-cycles threshold), so every cgroup pressure series
  # from this node is frozen and reads exactly like a calm node.
  - name: collector-stale fires when the textfile mtime is 400s old
    interval: 1m
    input_series:
      - series: 'node_textfile_mtime_seconds{file="/run/textfile/cgroup_psi.prom", instance="node-06:9100"}'
        values: 800+0x30
    alert_rule_test:
      - eval_time: 20m
        alertname: CgroupPsiCollectorStale
        exp_alerts:
          - exp_labels:
              file: /run/textfile/cgroup_psi.prom
              instance: "node-06:9100"
              severity: warning
  # The other side: a fresh mtime (10s old) must keep the collector-stale
  # alert quiet. Without this case, an always-firing collector-stale rule
  # would still pass the case above.
  - name: collector-stale silent when the textfile mtime is 10s old
    interval: 1m
    input_series:
      - series: 'node_textfile_mtime_seconds{file="/run/textfile/cgroup_psi.prom", instance="node-06:9100"}'
        values: 1190+0x30
    alert_rule_test:
      - eval_time: 20m
        alertname: CgroupPsiCollectorStale
        exp_alerts: []
