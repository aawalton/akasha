# promtool rule-unit-test fixture for PostgresHighConnections.
#
# Run by `promtool test rules`, which evaluates the rules in `rule_files`
# against the synthetic `input_series` below and asserts the exact set of
# alerts firing at each `eval_time`. `promtool check rules` only proves the
# rules PARSE, never that they FIRE. This rule shipped with NO fixture at all,
# so its fire path had never been executed anywhere before this file.
#
# `rule_files` is the bare relative name `alerts.yml` on purpose — promtool
# resolves those paths relative to the DIRECTORY OF THIS TEST FILE, and the
# harness materializes the composed ALERT_RULES as `alerts.yml` into a temp dir
# alongside a copy of this fixture.
#
# Semantics, as recorded by the cert-expiry fixture beside this one:
#
#   - `exp_labels` must NOT include `alertname`; promtool injects it.
#   - An empty `exp_alerts: []` asserts the alert does NOT fire.
#   - `humanizePercentage` renders 0.8 as `80%`.
#
# THE LABEL SETS BELOW ARE NOT DECORATION. They reproduce the live asymmetry
# exactly: `pg_settings_max_connections` carries {instance,job,server} while
# `sum by (server)` reduces the left side to {server} alone. Default vector
# matching therefore pairs NOTHING, and the expression returns zero rows
# forever — a permanently empty rule, indistinguishable from a healthy server.
# Deleting `on (server)` from the rule turns THIS FIXTURE RED rather than
# quietly silencing the alert, which is why the extra labels are carried here
# rather than simplified away.

evaluation_interval: 1m

rule_files:
  - alerts.yml

tests:
  # THE CASE THE OLD RULE WAS BLIND TO, and the reason this repair exists.
  # Eight connection buckets of 50 each: 400 of a 500 cap, 80% — the server is
  # genuinely running out of connections. The retired rule compared each BUCKET
  # against a fixed 250, and no bucket here is even a fifth of that, so it sat
  # silent while the server approached refusal. The `for: 2m` hold is asserted
  # from BOTH sides — still silent at 1m, firing at 5m — because without the 1m
  # leg a rule carrying no hold at all would pass this case unchanged.
  - name: many small buckets summing near the cap fire though no bucket approaches the old 250
    interval: 1m
    input_series:
      - series: 'pg_settings_max_connections{instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432"}'
        values: 500+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle",usename="app1"}'
        values: 50+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle",usename="app2"}'
        values: 50+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle",usename="app3"}'
        values: 50+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle",usename="app4"}'
        values: 50+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="active",usename="app5"}'
        values: 50+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="active",usename="app6"}'
        values: 50+0x20
      - series: 'pg_stat_activity_count{datname="electric",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle",usename="electric"}'
        values: 50+0x20
      - series: 'pg_stat_activity_count{datname="electric",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle in transaction",usename="electric"}'
        values: 50+0x20
    alert_rule_test:
      - eval_time: 1m
        alertname: PostgresHighConnections
        exp_alerts: []
      - eval_time: 5m
        alertname: PostgresHighConnections
        exp_alerts:
          - exp_labels:
              server: postgres-cnpg-rw.postgres.svc.cluster.local:5432
              severity: warning

  # TODAY'S REAL LOAD, read off the cluster on 2026-08-13: 233 connections of a
  # 500 cap across buckets whose largest holds 180. The repair must not buy its
  # sensitivity by paging on a healthy server, and 46.6% is nowhere near the
  # threshold. The largest bucket here is the busiest on the estate and still
  # sits barely two thirds of the way to the retired rule's fixed 250.
  - name: today's healthy load stays quiet
    interval: 1m
    input_series:
      - series: 'pg_settings_max_connections{instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432"}'
        values: 500+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle",usename="app"}'
        values: 180+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle",usename="electric"}'
        values: 40+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="active",usename="app"}'
        values: 13+0x20
    alert_rule_test:
      - eval_time: 5m
        alertname: PostgresHighConnections
        exp_alerts: []

  # THE HOLD IS LOAD-BEARING, not decoration. A single one-minute excursion to
  # 84% — the shape of the brief spikes this estate actually shows, 18 minutes
  # above 250 connections across 30 days — must not page anybody. The condition
  # is true for exactly one evaluation, short of the 2m hold, so nothing fires.
  # Shortening `for` to 1m or removing it turns this case red.
  - name: a one-minute spike above the threshold does not fire
    interval: 1m
    input_series:
      - series: 'pg_settings_max_connections{instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432"}'
        values: 500+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle",usename="app"}'
        values: 200 200 200 400 200 200 200 200 200 200 200
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="active",usename="app"}'
        values: 20+0x20
    alert_rule_test:
      - eval_time: 4m
        alertname: PostgresHighConnections
        exp_alerts: []
      - eval_time: 8m
        alertname: PostgresHighConnections
        exp_alerts: []

  # THE THRESHOLD IS PINNED rather than merely satisfied. Exactly 375 of 500 is
  # exactly 0.75 and the comparison is strict, so this stays silent. A fixture
  # that only ever tested 80% would pass unchanged if someone loosened the
  # constant to 0.9; this case fails if the operator is relaxed to `>=`, and
  # the firing case above fails if the constant is raised past 0.8.
  - name: exactly at the threshold does not fire
    interval: 1m
    input_series:
      - series: 'pg_settings_max_connections{instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432"}'
        values: 500+0x20
      - series: 'pg_stat_activity_count{datname="postgres",instance="postgres-exporter.prometheus.svc.cluster.local:9187",job="postgres-exporter",server="postgres-cnpg-rw.postgres.svc.cluster.local:5432",state="idle",usename="app"}'
        values: 375+0x20
    alert_rule_test:
      - eval_time: 5m
        alertname: PostgresHighConnections
        exp_alerts: []
