apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/instance: talos-subnet-router
    app.kubernetes.io/managed-by: deploy-script
    app.kubernetes.io/name: tailscale-subnet-router
    app.kubernetes.io/part-of: headscale
  name: talos-subnet-router
  namespace: headscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: talos-subnet-router
      app.kubernetes.io/name: tailscale-subnet-router
  template:
    metadata:
      labels:
        app.kubernetes.io/component: data-plane
        app.kubernetes.io/instance: talos-subnet-router
        app.kubernetes.io/managed-by: deploy-script
        app.kubernetes.io/name: tailscale-subnet-router
        app.kubernetes.io/part-of: headscale
    spec:
      containers:
        - env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  key: TS_AUTHKEY
                  name: subnet-router-auth
            - name: TS_EXTRA_ARGS
              value: --login-server=https://headscale.alanwalton.com --advertise-routes=10.244.0.0/16,10.96.0.0/12 --accept-dns=false
            - name: TS_USERSPACE
              value: "true"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_HOSTNAME
              value: talos-subnet-router
            - name: TS_KUBE_SECRET
              value: ""
          image: tailscale/tailscale:v1.98.10
          name: tailscale
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/lib/tailscale
              name: state
            - mountPath: /tmp
              name: tmp
            - mountPath: /run
              name: run
      hostAliases:
        - hostnames:
            - headscale.alanwalton.com
          ip: 192.168.68.240
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: tmp
        - emptyDir: {}
          name: run
        - emptyDir: {}
          name: state
