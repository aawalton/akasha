apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: gc
    app.kubernetes.io/instance: infra
    app.kubernetes.io/managed-by: deploy-script
    app.kubernetes.io/name: ci-storage-maintain
    app.kubernetes.io/part-of: ci-tools
  name: ci-storage-maintain
  namespace: ci
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: gc
      app.kubernetes.io/instance: infra
      app.kubernetes.io/name: ci-storage-maintain
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gc
        app.kubernetes.io/instance: infra
        app.kubernetes.io/name: ci-storage-maintain
    spec:
      containers:
        - command:
            - sh
            - -c
            - apk add --no-cache git curl >/dev/null 2>&1 && while true; do timeout 1800 env RUN_HOUSEKEEPING=1 sh /opt/bin/prune-ci-storage.sh || exit 1; sleep 21600; done
          image: alpine:3.21
          name: maintain
          resources:
            limits:
              memory: 2048Mi
            requests:
              cpu: 200m
              memory: 2048Mi
          volumeMounts:
            - mountPath: /ci-storage
              name: ci-storage
            - mountPath: /opt/bin
              name: scripts
      nodeSelector:
        alanwalton.com/workload-class.ci: "true"
      restartPolicy: Always
      volumes:
        - hostPath:
            path: /var/lib/ci-storage
            type: DirectoryOrCreate
          name: ci-storage
        - configMap:
            defaultMode: 493
            name: ci-storage-scripts
          name: scripts
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
