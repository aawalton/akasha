apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: gc
    app.kubernetes.io/instance: infra
    app.kubernetes.io/managed-by: deploy-script
    app.kubernetes.io/name: ci-storage-scripts
    app.kubernetes.io/part-of: ci-tools
  name: ci-storage-scripts
  namespace: ci
data:
  prune-ci-storage.sh: |
    #!/bin/sh
    set -u

    CACHE=/ci-storage
    REPO=$CACHE/repo
    PROTECT_SHA="${PROTECT_SHA:-}"
    GRACE_MINUTES="${GRACE_MINUTES:-60}"
    GIT_TRANSPORT_URL="${GIT_TRANSPORT_URL:-http://git-transport.git.svc.cluster.local:3000}"
    RUN_HOUSEKEEPING="${RUN_HOUSEKEEPING:-0}"
    # Shared prep flock (#9479). The maintain gc acquires this SAME lock before
    # repacking so a prep fetch and a maintain `git gc --prune=now` can never touch
    # the repo concurrently (#15236 — closes the fetch-vs-gc-prune corruption race).
    PREP_FLOCK="$CACHE/.prep-repo.flock"

    # /ci-storage/repo is owned by uid 1000 (the prep pod's uid and the tmpfs
    # mount uid) but this script runs as root. Whitelist the path so git's
    # dubious-ownership guard doesn't reject every operation below.
    git config --global --add safe.directory "$REPO" 2>/dev/null || true

    # Disable AUTOMATIC gc on the shared bare repo (#14446): ephemeral pe-* step
    # pods would otherwise auto-gc, get reaped mid-repack, and leave a stale gc.pid
    # whose foreign hostname the maintain pod can never verify — masking its gc
    # forever (lock axis of the #9395 hazard). Maintain is the sole gc authority
    # (explicit `git gc` ignores gc.auto); idempotent. See ci-storage-maintenance.md.
    if [ -d "$REPO" ]; then
      git -C "$REPO" config gc.auto 0 2>/dev/null || true
    fi

    # Exit code of the maintain `git gc`; re-raised at script end so a failed gc
    # fails the Job instead of being masked (stays 0 on verb runs, #14446).
    GC_RC=0

    echo "[prune] start protect=${PROTECT_SHA:-<none>} grace=${GRACE_MINUTES}min housekeeping=$RUN_HOUSEKEEPING"

    # 1. Fetch current branch tips. Failure is fail-safe (skip SHA-based prune).
    HAVE_TIPS=1
    TIPS_BODY=$(curl -sf --max-time 10 "$GIT_TRANSPORT_URL/internal/branch-tips" 2>/dev/null || echo "")
    if [ -z "$TIPS_BODY" ]; then
      echo "[prune] WARN: branch-tips fetch failed; skipping SHA-based prune"
      HAVE_TIPS=0
    fi

    if [ "$HAVE_TIPS" = "1" ]; then
      TIPS=$(echo "$TIPS_BODY" | tr -c '[:xdigit:]' '\n' | grep -E '^[0-9a-f]{40}$' || true)
      # Per-commit checkouts/installs/worktrees/refs are keyed on the FULL 40-char
      # commit SHA (collision-proof — see checkoutPath() in pod-spec-helpers), so
      # match on-disk dir names against full tips, not a 7-char prefix. Legacy
      # short-named dirs from before this cutover never match a full tip and age
      # out via the grace window below — live workspaces stay protected by the
      # heartbeat regardless of key length.
      TIP_KEYS=$(echo "$TIPS" | sort -u)
      if [ -n "$PROTECT_SHA" ]; then
        TIP_KEYS=$(printf '%s\n%s\n' "$TIP_KEYS" "$PROTECT_SHA" | sort -u)
      fi

      # Preparation acquires the instructions repository once per run and leaves it keyed
      # on the same full commit SHA the four beside it use. It is enumerated here AND
      # removed on the `rm -rf` below, both rather than either — enumerated alone it
      # would never be collected, and removed alone a tree whose checkout had already
      # been reaped would be orphaned with no key left to find it by.
      # `$CACHE/books` is removed but NOT enumerated: nothing populates it, so it can
      # contribute no keys, and the removal only drains what earlier runs left behind.
      ALL_SHAS=$(
        for d in "$CACHE/checkouts" "$CACHE/installs" "$REPO/refs/pipelines" "$REPO/worktrees" "$CACHE/instructions"; do
          [ -d "$d" ] && ls "$d" 2>/dev/null
        done | sort -u
      )

      # `on_disk` counts KEYS and not workspaces, and says so, because #18846 folded a
      # second population into it and #18905 a third. Before that every key had a
      # checkout, so the one number meant "per-commit workspaces on this node"; now a key
      # can be a content tree whose checkout is already gone, and the figure would have
      # drifted up with nothing in the line saying why. Each content count is printed
      # beside it rather than excluded from it, so what is being reaped stays visible
      # instead of being netted out to keep an old number comparable.
      #
      # `|| true` and NOT `|| echo 0`, which is what these four carried until #18905
      # measured one. `grep -c` on no matches PRINTS 0 and EXITS 1, so the fallback
      # fired on top of a count that was already there and the substitution captured
      # "0\n0" — the report line then broke across two lines mid-sentence, on exactly
      # the run where a directory was missing and somebody was reading it to find out
      # why. Keeping the exit code from ending the substitution is all that is wanted.
      n_total=$(echo "$ALL_SHAS" | grep -c . 2>/dev/null || true)
      n_instr=$(ls "$CACHE/instructions" 2>/dev/null | grep -c . 2>/dev/null || true)
      n_tips=$(echo "$TIP_KEYS" | grep -c . 2>/dev/null || true)
      echo "[prune] on_disk_keys=$n_total (of which instructions_trees=$n_instr) tips=$n_tips"

      n_pruned=0
      n_grace=0
      for sha in $ALL_SHAS; do
        if echo "$TIP_KEYS" | grep -qx "$sha"; then continue; fi
        # Grace window: protect SHAs whose checkout DIR INODE mtime is recent.
        # NB `-maxdepth 0` stats only the dir inode — in-tree build writes do NOT
        # advance it, so this is NOT kept fresh by an active build on its own.
        # Liveness comes from the per-step workspace heartbeat (#11986): every
        # running step pod touches its own checkout dir on a 60s loop (see
        # pod-spec-entrypoint.ts), keeping a live workspace inside this window and
        # preventing a peer prune from evicting it mid-run.
        if [ -d "$CACHE/checkouts/$sha" ]; then
          if find "$CACHE/checkouts/$sha" -maxdepth 0 -mmin -"$GRACE_MINUTES" 2>/dev/null | grep -q .; then
            n_grace=$((n_grace + 1))
            continue
          fi
        fi
        rm -rf "$CACHE/checkouts/$sha" "$CACHE/installs/$sha" "$REPO/worktrees/$sha" "$CACHE/instructions/$sha" "$CACHE/books/$sha" 2>/dev/null
        if [ -d "$REPO" ]; then
          git -C "$REPO" update-ref -d "refs/pipelines/$sha" 2>/dev/null || true
        fi
        n_pruned=$((n_pruned + 1))
      done
      echo "[prune] pruned=$n_pruned protected_grace=$n_grace"

      # Graph cache SHA-tip prune (#10228). Protected key set = tree OID of every
      # current branch tip (plus PROTECT_SHA, if any). Cross-branch pipelines on
      # the same tree share the cache, so the key is the tree OID, not the commit
      # SHA. Resolve via the bare repo: every fetched tip's commit is present
      # because prep just fetched it; if a particular SHA can't be resolved
      # (e.g. the bare repo was reset and hasn't refetched yet), skip that tip
      # rather than over-delete. Files newer than GRACE_MINUTES are also kept,
      # covering the case where a branch tip advances mid-pipeline and orphans
      # an in-flight pipeline's tree from the new tip set.
      if [ -d "$CACHE/graph" ] && [ -d "$REPO" ]; then
        PROTECT_TREES=""
        PROTECT_SHA_LIST=$(printf '%s\n%s\n' "$TIPS" "$PROTECT_SHA" | grep -E '^[0-9a-f]+$' | sort -u)
        for sha in $PROTECT_SHA_LIST; do
          tree=$(git -C "$REPO" rev-parse --verify --quiet "${sha}^{tree}" 2>/dev/null || true)
          if [ -n "$tree" ]; then
            PROTECT_TREES=$(printf '%s\n%s\n' "$PROTECT_TREES" "$tree" | grep -E '^[0-9a-f]{40}$' | sort -u)
          fi
        done
        n_graph_total=0
        n_graph_pruned=0
        n_graph_grace=0
        for f in "$CACHE/graph"/*.json; do
          [ -f "$f" ] || continue
          n_graph_total=$((n_graph_total + 1))
          base=${f##*/}
          tree=${base%.json}
          if echo "$PROTECT_TREES" | grep -qx "$tree"; then continue; fi
          # Grace window for in-flight writes: an mtime within GRACE_MINUTES
          # protects the file (same predicate as checkouts).
          if find "$f" -maxdepth 0 -mmin -"$GRACE_MINUTES" 2>/dev/null | grep -q .; then
            n_graph_grace=$((n_graph_grace + 1))
            continue
          fi
          rm -f "$f" 2>/dev/null
          n_graph_pruned=$((n_graph_pruned + 1))
        done
        echo "[prune] graph total=$n_graph_total pruned=$n_graph_pruned protected_grace=$n_graph_grace"
      fi
    fi

    # 2. Cron-only housekeeping: gc + bun-cache LRU + reverse-reachability LRU
    #    + reverse-reachability orphan-tmp sweep + graph LRU + graph orphan-tmp
    #    sweep + addon-build LRU + addon-build orphan-tmp sweep + retired
    #    bundle-budget cache reclaim + gc.log + worktree prune.
    if [ "$RUN_HOUSEKEEPING" = "1" ] && [ -d "$REPO" ]; then
      if [ -f "$REPO/gc.log" ]; then
        echo "[prune] removing stale gc.log"
        rm -f "$REPO/gc.log"
      fi
      # Repo gc, serialized against prep on the SHARED prep flock (#15236). Before
      # #15236 the maintain gc took NO lock while prep held `flock -x -w 60` on
      # $PREP_FLOCK — independent locks over one repo, so a prep `git fetch` writing
      # objects could run concurrently with `git gc --prune=now` deleting them before
      # `update-ref` anchored them, corrupting the ODB (measured: gc --prune=now DOES
      # prune a not-yet-referenced object; the #15219 corruption writer). Acquiring
      # the prep flock for the gc closes that race. busybox flock has no -w, so a
      # bounded nonblock retry (~60s, matching prep's -w 60) is used; if a prep holds
      # the lock past that, DEFER gc to the next 6h cycle (housekeeping is not urgent)
      # rather than fail. The subshell's exit code carries the gc rc out to GC_RC.
      # #15270: guarantee the shared prep flock is world-writable BEFORE the `9>`
      # redirect below opens/creates it (root's umask would make it 0644, denying
      # write-open to the uid-1000 prep step — the #15236 regression). Atomic 0666
      # create-if-missing + unconditional chmod is idempotent and order-independent.
      if [ ! -e "$PREP_FLOCK" ]; then
        ( umask 0; : > "$PREP_FLOCK" ) 2>/dev/null || true
      fi
      chmod 0666 "$PREP_FLOCK" 2>/dev/null || true
      (
        acquired=0
        i=0
        while [ "$i" -lt 30 ]; do
          if flock -x -n 9; then acquired=1; break; fi
          sleep 2
          i=$((i + 1))
        done
        if [ "$acquired" != 1 ]; then
          echo "[prune] gc DEFERRED: prep flock held >60s (prep active); retry next cycle"
          exit 0
        fi
        git -C "$REPO" worktree prune 2>/dev/null || true
        # Unconditional residual-gc.pid clear (#15236, supersedes the #14446 age
        # heuristic). Maintain is the sole gc authority (gc.auto=0 everywhere) and
        # runs serially — one DaemonSet pod per node, sweeps sequential, and now
        # flock-serialized — so NO live gc can exist here. Any gc.pid present is a
        # prior killed gc's residue; clear it deterministically instead of trusting
        # git's holder-liveness check, which is unreliable across container
        # incarnations (pid-namespace reuse) and was the "git gc exited 128" poison.
        if [ -f "$REPO/gc.pid" ]; then
          echo "[prune] clearing residual gc.pid (holder=[$(cat "$REPO/gc.pid" 2>/dev/null)]) — sole serial gc authority, cannot be a live gc"
          rm -f "$REPO/gc.pid"
        fi
        echo "[prune] running git gc --prune=now (under prep flock)"
        # Un-masked (#14446): keep gc's stderr and let a non-zero exit propagate as
        # the subshell's exit code. After the gc.auto=0 + flock + residual-lock-clear
        # fixes, a non-zero gc is a genuine anomaly — surfaced as GC_RC below.
        git -C "$REPO" gc --prune=now 2>&1 || exit $?
        exit 0
      ) 9>"$PREP_FLOCK"
      GC_RC=$?
      if [ "$GC_RC" -ne 0 ]; then
        echo "[prune] ERROR git gc --prune=now exited $GC_RC (repo=$REPO) — gc did NOT complete; failing the Job so JobFailed surfaces it"
      fi
      # bun-cache atime LRU: drop files not accessed in >24 h. Busybox find in
      # this image lacks -amin so granularity is days, not hours; -atime +0
      # matches files older than one full 24h period.
      find "$CACHE/bun-cache" -mindepth 1 -atime +0 -delete 2>/dev/null || true
      # reverse-reachability atime LRU: drop content-addressed artifacts not
      # accessed in >48 h. Coarser cache key than bun-cache (per-TS-surface
      # rather than per-package install), so the threshold is correspondingly
      # longer — files at the bottom of active-branch turnover may not be read
      # for hours but remain useful within a working week. -atime +1 matches
      # files older than two full 24h periods.
      echo "[prune] reverse-reachability atime LRU (>48h)"
      find "$CACHE/reverse-reachability" -mindepth 1 -name '*.json' -atime +1 -delete 2>/dev/null || true
      # Orphan atomic-write stragglers from interrupted compute-reverse-reachability
      # runs. The writer's pid is long gone by the time housekeeping fires.
      find "$CACHE/reverse-reachability" -mindepth 1 -name '*.tmp-*' -mmin +60 -delete 2>/dev/null || true
      # Graph cache atime LRU (#10228): same policy as reverse-reachability.
      # The SHA-tip prune above is the hot path; this is the eventually-
      # consistent backstop for tree-OID keys orphaned by tip-set fetch
      # glitches. Atime updates on every readCachedGraph in @infra/checks, so
      # a graph reached by a live branch tip resets its LRU clock and stays
      # resident; a graph whose branch was deleted ages out within two days.
      echo "[prune] graph atime LRU (>48h)"
      find "$CACHE/graph" -mindepth 1 -name '*.json' -atime +1 -delete 2>/dev/null || true
      # Orphan atomic-write stragglers from interrupted preparation-build-graph
      # runs (the writer uses {path}.tmp-<pid>-<rand> → rename, same as
      # compute-reverse-reachability).
      find "$CACHE/graph" -mindepth 1 -name '*.tmp-*' -mmin +60 -delete 2>/dev/null || true
      # addon-build cache atime LRU (#11403, per-deployable keying #13549): same
      # policy as graph/reverse-reachability. Tarballs at
      # /ci-storage/addon-build/<addonName>-<perAddonHash>.tar produced per
      # deployable by the addon-build workflow step on cache miss; atime updates
      # on every cache-hit extract, so an active deployable's hash stays resident
      # while a stale per-addon hash ages out within two days. The '*.tar' glob
      # matches the <name>-<hash>.tar shape unchanged.
      echo "[prune] addon-build atime LRU (>48h)"
      find "$CACHE/addon-build" -mindepth 1 -name '*.tar' -atime +1 -delete 2>/dev/null || true
      # Orphan atomic-write stragglers from interrupted addon-build runs (the
      # workflow command writes to {path}.tmp-$$ → mv, same shape as the
      # graph/reverse-reachability writers).
      find "$CACHE/addon-build" -mindepth 1 -name '*.tar.tmp-*' -mmin +60 -delete 2>/dev/null || true
      # Bundle-budget cache reclaim (#18157). The cache (#11402) held 0-byte .ok
      # markers keyed on treeSha, swept by an atime LRU. #18157 removed
      # check-bundle-budget, so the directory has no writer and no reader, and an
      # LRU over it would sweep a set that only shrinks. This reclaims whatever
      # each node still carries; it is a no-op on every cycle after the first.
      rm -rf "$CACHE/bundle-budget" 2>/dev/null || true
    fi

    echo "[prune] done"
    df -i "$CACHE" 2>/dev/null || true
    df -h "$CACHE" 2>/dev/null || true

    # Re-raise a failed maintain gc after housekeeping, so the Job fails
    # (backoffLimit=0 → JobFailed) instead of masking it (#14446).
    exit "$GC_RC"
