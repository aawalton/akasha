# Homebrew/linuxbrew formulae for the agent external-tool baseline.
# Applied by provision-workstation.sh via `brew bundle`, which reads this file
# where it stands rather than placing it anywhere.

brew "kubernetes-cli" # kubectl
brew "libpq"          # psql + pg_* client bins (keg-only; symlinked by the script)
brew "sops"           # age-encrypted secret manifests
brew "yt-dlp"         # `ops media clip` — YouTube audio extraction (pairs with ffmpeg)
brew "node_exporter"  # Prometheus host metrics — node-exporter.service scrapes :9100
brew "stockfish"      # `ops chess` — self-hosted UCI engine (legality/eval/strength-limited play)
brew "lc0"            # `ops chess play-game` — self-hosted lc0 UCI engine loading Maia weights (human-like opponent)
brew "strace"         # syscall tracer for diagnosing process/glob ENOENT hangs (e.g. bun --filter)
brew "shellcheck"     # the code repo's local validation set judges every tracked shell script with it
