id: no-hardcoded-ast-grep-scan
message: |
  A check must NOT run `ast-grep scan` itself. Rules are discovered from every `sgconfig.yml` in the
  tree and run by `check-ast-grep.ts`, so a rule costs one YAML file and no CI registration. A
  hardcoded invocation pins the route to one package again — which is the cost gradient this route
  exists to flatten — and skips the per-rule population check, so a rule that matched nothing would
  report clean. Add a rule under your package's `rules/` dir instead; the runner is
  infra/cluster-checks/src/checks/check-ast-grep.ts.

  WHAT THIS REACHES, and why it is spelled three ways. The route's own defect used to pass green in
  every spelling but one: the rule required a template-string node inside `check-configs*.ts`, so a
  double-quoted or single-quoted command slipped through on the node kind, a backtick command in any
  other file slipped through on the glob, and the binary-and-argv form was invisible altogether. A
  check config can be written anywhere a `CheckConfig` is — `tools/lib/check-workflow/index.ts`
  builds them at `generatedTestStepConfigs` outside `check-configs*.ts` — so the reach is every TypeScript source in
  the tree, and the three arms are the three ways a scan gets launched: a command string under a
  `commands:` key in any quoting; a process spawn handed a shell string that runs the scan; and a
  process spawn handed `ast-grep` and a `scan` subcommand as separate arguments.

  WHAT IT DOES NOT REACH. A rule refuses spellings, not dataflow: a command assembled into a variable
  and spawned from there is past what ast-grep can see, here as in any rule. The route's own spawn in
  `check-ast-grep.ts` composes its arguments away from the call and so is not matched — it is the one
  sanctioned invoker, and it is the runner this message points you at. No file is exempted by name.
severity: error
language: ts
files:
  - "**/*.ts"
  - "**/*.tsx"
ignores:
  - "**/dist/**"
rule:
  any:
    # A scan written into a check's registration, in any string spelling.
    - all:
        - any:
            - kind: string
            - kind: template_string
        - regex: "ast-grep\\s+scan"
        - inside:
            stopBy: end
            kind: pair
            has:
              field: key
              regex: "^commands$"
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: "\\b(spawnSync|spawn|execSync|execFileSync|execFile|exec)$"
        - has:
            field: arguments
            has:
              stopBy: end
              any:
                - kind: string
                - kind: template_string
              regex: "ast-grep\\s+scan"
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: "\\b(spawnSync|spawn|execSync|execFileSync|execFile|exec)$"
        - has:
            field: arguments
            has:
              stopBy: end
              any:
                - kind: string
                - kind: template_string
              regex: "^[\"'`]ast-grep[\"'`]$"
        - has:
            field: arguments
            has:
              stopBy: end
              any:
                - kind: string
                - kind: template_string
              regex: "^[\"'`]scan[\"'`]$"
