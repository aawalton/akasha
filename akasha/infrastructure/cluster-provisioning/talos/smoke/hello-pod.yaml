apiVersion: v1
kind: Pod
metadata:
  name: smoke-hello
  namespace: default
  labels:
    app.kubernetes.io/name: smoke-hello
    app.kubernetes.io/managed-by: infra-talos
spec:
  restartPolicy: Never
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: hello
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo talos-smoke-ok && sleep 3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      securityContext:
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
