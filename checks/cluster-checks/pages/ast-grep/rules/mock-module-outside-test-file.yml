id: mock-module-outside-test-file
message: |
  `mock.module` here is invisible to `check-mock-module-surface`, which scans only `*.test.ts[x]`.
  Moving these calls to a non-test sibling does not relocate the factory-shape guarantee — it
  deletes it, and the tree goes green on the deletion. Keep `mock.module` in the `*.test.ts[x]`
  file that needs it; if a static import must resolve against the mocks, use
  `const { x } = await import("./m")` after the mock block rather than extracting a helper.

  BOUNDS — what this rule does NOT cover:
    * the SHAPE of a mock factory. That is `check-mock-module-surface`'s job; this rule only keeps
      the calls inside the window where that scanner can see them.
    * NO FILE IS EXEMPTED BY NAME. One was: `_dispatch-mocks-test-helpers.ts` held 16 `mock.module`
      calls and was excluded when this rule landed, which made a green from the rule mean nothing
      about the one file everybody knew was a standing instance of it. The calls have since moved
      into `dispatch.unit.test.ts` — the remedy this message prescribes — and the exclusion is gone.
      An exclusion added back here reads as coverage the rule is no longer giving.
severity: error
language: ts
files:
  - "**/*.ts"
  - "**/*.tsx"
ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/dist/**"
rule:
  pattern: mock.module($$$ARGS)
