apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: temper
    app.kubernetes.io/managed-by: deploy-script
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: temper
  name: web
  namespace: temper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: temper
      app.kubernetes.io/name: web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/secrets: 2c441b6c392bd3f4589d74518b6c9037
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: temper
        app.kubernetes.io/managed-by: deploy-script
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: temper
    spec:
      containers:
        - command:
            - bun
            - run
            - server.ts
          env:
            - name: NODE_ENV
              value: production
            - name: AKASHA_ROOT
              value: /app/repo
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: PAGE_WRITER
              value: temper-web
            - name: BASE_URL
              value: https://tempereso.com
            - name: WATCHER_DIR
              value: /app/repo/temper/web/watcher
            - name: ADDONS_BUNDLE_DIR
              value: /app/repo/temper/web/addons
          envFrom:
            - secretRef:
                name: temper-secrets
          image: registry.registry.svc.cluster.local:5000/cluster/bun-git:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /api/watcher/version
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          name: web
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            failureThreshold: 12
            httpGet:
              path: /api/watcher/version
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /app
              name: orchestrator-cache
            - mountPath: /tmp
              name: tmp
          workingDir: /app/repo/temper/web
        - command:
            - sh
            - -c
            - sleep infinity
          env:
            - name: GIT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GIT_ACCESS_TOKEN
                  name: temper-secrets
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: credential.helper
            - name: GIT_CONFIG_VALUE_0
              value: '!f() { echo username=x-access-token; echo "password=$GIT_ACCESS_TOKEN"; }; f'
            - name: HOME
              value: /tmp
          image: registry.registry.svc.cluster.local:5000/cluster/bun-git:latest
          imagePullPolicy: IfNotPresent
          name: code-sync
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 10m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /app
              name: orchestrator-cache
            - mountPath: /tmp
              name: tmp
      initContainers:
        - command:
            - sh
            - -c
            - chown 1000:1000 /app
          image: registry.registry.svc.cluster.local:5000/cluster/bun-git:latest
          imagePullPolicy: IfNotPresent
          name: init-chown-cache
          resources:
            limits:
              memory: 16Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /app
              name: orchestrator-cache
        - command:
            - sh
            - -c
            - |-
              set -e
              mkdir -p /app
              LOCK="/app/.init-lock"
              touch "$LOCK"
              (
                attempts=0
                until flock -n 9; do
                  attempts=$((attempts+1))
                  if [ "$attempts" -ge 900 ]; then
                    echo "init-code: timed out waiting for lock after ${attempts}s" >&2
                    exit 1
                  fi
                  sleep 1
                done
                rm -f /app/repo/.git/index.lock
                if git -C /app/repo rev-parse HEAD >/dev/null 2>&1; then
                  WANT=$(printf %s "http://git-transport.git.svc.cluster.local:3000/alan/akasha.git" | sed "s|^.*@||")
                  HAVE=$(git -C /app/repo config --get remote.origin.url 2>/dev/null | sed "s|^.*@||")
                  if [ "$HAVE" != "$WANT" ]; then
                    echo "init-code: origin is $HAVE but this pod is for $WANT — repointing"
                    git -C /app/repo remote set-url origin "http://git-transport.git.svc.cluster.local:3000/alan/akasha.git"
                  fi
                  echo "init-code: /app/repo already cloned, fetching origin and resetting to CHECKOUT_COMMIT"
                  git -C /app/repo fetch origin --prune
                  git -C /app/repo reset --hard CHECKOUT_COMMIT
                  echo "init-code: source-sync to CHECKOUT_COMMIT complete"
                else
                  if [ -e /app/repo ]; then
                    echo "init-code: /app/repo exists but HEAD is unreadable — wiping partial state"
                    rm -rf /app/repo
                  fi
                  echo "init-code: cloning monorepo into /app/repo"
                  git clone --branch main "http://git-transport.git.svc.cluster.local:3000/alan/akasha.git" /app/repo
                  git -C /app/repo reset --hard CHECKOUT_COMMIT
                  echo "init-code: clone complete at CHECKOUT_COMMIT"
                fi
                echo "init-code: running bun install --frozen-lockfile"
                cd /app/repo && bun install --frozen-lockfile
                echo "init-code: bun install complete"
              ) 9>"$LOCK"
          env:
            - name: GIT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GIT_ACCESS_TOKEN
                  name: temper-secrets
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: credential.helper
            - name: GIT_CONFIG_VALUE_0
              value: '!f() { echo username=x-access-token; echo "password=$GIT_ACCESS_TOKEN"; }; f'
            - name: HOME
              value: /tmp
          image: registry.registry.svc.cluster.local:5000/cluster/bun-git:latest
          imagePullPolicy: IfNotPresent
          name: init-code
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /app
              name: orchestrator-cache
            - mountPath: /tmp
              name: tmp
        - command:
            - sh
            - -c
            - |-
              set -e
              mkdir -p /app/repo/temper/web/watcher
              cp -f /build/temper-watcher.exe /app/repo/temper/web/watcher/temper-watcher.exe
              cp -f /build/temper-watcher-worker.exe /app/repo/temper/web/watcher/temper-watcher-worker.exe
              cp -f /build/version.txt /app/repo/temper/web/watcher/version.txt
              echo "init-watcher: copied into /app/repo/temper/web/watcher"
          image: registry.registry.svc.cluster.local:5000/cluster/temper-watcher:latest
          imagePullPolicy: Always
          name: init-watcher
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /app
              name: orchestrator-cache
            - mountPath: /tmp
              name: tmp
        - command:
            - sh
            - -c
            - |-
              set -e
              mkdir -p /app/repo/temper/web/addons
              cp -f /bundle/temper-addons.zip /app/repo/temper/web/addons/temper-addons.zip
              cp -f /bundle/version.txt /app/repo/temper/web/addons/version.txt
              echo "init-addons: copied into /app/repo/temper/web/addons"
          image: registry.registry.svc.cluster.local:5000/cluster/temper-addons:b305c2c82c8425005dd5fbb348c333ff09e4962a33ffdeaefbe92039071159ec
          imagePullPolicy: IfNotPresent
          name: init-addons
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /app
              name: orchestrator-cache
            - mountPath: /tmp
              name: tmp
        - command:
            - sh
            - -c
            - |-
              set -e
              LOCK="/app/.init-lock"
              touch "$LOCK"
              (
                attempts=0
                until flock -n 9; do
                  attempts=$((attempts+1))
                  if [ "$attempts" -ge 900 ]; then
                    echo "init-build: timed out waiting for lock after ${attempts}s" >&2
                    exit 1
                  fi
                  sleep 1
                done
                cd /app/repo/temper/web
                CHECKED_OUT=$(git -C /app/repo rev-parse HEAD)
                BUILT_FROM=$(cat build/.built-from 2>/dev/null || true)
                if [ -f build/server/index.js ] && [ "$BUILT_FROM" = "$CHECKED_OUT" ]; then
                  echo "init-build: the build beside the server is of $CHECKED_OUT already"
                  exit 0
                fi
                echo "init-build: the build beside the server is of ${BUILT_FROM:-nothing}, the checkout is of $CHECKED_OUT"
                NEXT_PUBLIC_BUILD_SHA=$CHECKED_OUT
                VITE_BUILD_SHA=$CHECKED_OUT
                export NEXT_PUBLIC_BUILD_SHA VITE_BUILD_SHA
                echo "init-build: building temper/web at $CHECKED_OUT"
                cd /app/repo
                bun install --frozen-lockfile
                cd /app/repo/temper/web
                rm -rf build.next build.old
                BUILD_DIRECTORY=build.next /app/repo/node_modules/.bin/react-router build
                printf %s "$CHECKED_OUT" > build.next/.built-from
                mkdir -p build
                mv build build.old
                mv build.next build
                rm -rf build.old
                echo "init-build: build complete"
              ) 9>"$LOCK"
          env:
            - name: HOME
              value: /tmp
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: temper-secrets
          image: registry.registry.svc.cluster.local:5000/cluster/bun-git:latest
          imagePullPolicy: IfNotPresent
          name: init-build
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /app
              name: orchestrator-cache
            - mountPath: /tmp
              name: tmp
      nodeSelector:
        alanwalton.com/workload-class.serve: "true"
      volumes:
        - hostPath:
            path: /var/temper-web-cache
            type: DirectoryOrCreate
          name: orchestrator-cache
        - emptyDir:
            sizeLimit: 1Gi
          name: tmp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: temper
    app.kubernetes.io/managed-by: deploy-script
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: temper
  name: web
  namespace: temper
spec:
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app.kubernetes.io/instance: temper
    app.kubernetes.io/name: web
  type: ClusterIP
