# Disk-backed swapfile — the host's OOM cushion below zram.
#
# The box ships only a 16 GiB zram device (RAM-backed compressed swap), which
# competes for the very RAM it would protect — so SwapFree pins at ~0 under load
# and gives no genuine overflow. This unit activates the 64 GiB /var/swap/swapfile
# (created by provision-workstation.sh step 9) as a real disk-backed backstop.
#
# Priority=10 is below zram's 100, so the kernel prefers fast zram first and only
# spills to this slow disk swap when zram is exhausted — i.e. exactly the genuine
# memory-spike case we want to cushion, never the routine path (Priority is what
# governs device order; vm.swappiness is deliberately left at the zram-tuned
# default). Installed + enabled by setup-symlinks.sh so an ostree /etc reset
# self-heals on the next reconcile run. The `swapfile-unit` provisioned-file page
# states where this is placed and what reloads it.

[Unit]
Description=Disk-backed swapfile (OOM cushion below zram; local GPU training headroom)

[Swap]
What=/var/swap/swapfile
Priority=10

[Install]
WantedBy=swap.target
